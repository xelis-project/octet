[package]
name = "octet"
version = "0.1.0"
edition = "2024"
description = "Binary serialization with fallible byte sources, sinks, and contextual errors"
readme = "README.md"
authors = ["Slixe <slixeprivate@gmail.com>"]
license = "MIT"
keywords = ["binary", "serialization", "bytes", "fallible", "error"]

[dependencies]
bytes = "1.11.1"
matriochka = "0.1.0"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "1"

[features]
serde = ["dep:serde"]