[package]
name = "octet"
version = "0.2.2"
edition = "2024"
description = "Binary serialization with fallible byte sources, sinks, and contextual errors"
readme = "README.md"
authors = ["Slixe <slixeprivate@gmail.com>"]
license = "MIT"
keywords = ["binary", "serialization", "bytes", "fallible", "error"]

[workspace]
members = ["octet-derive"]

[dependencies]
bytes = "1.11.1"
hex = "0.4.3"
matriochka = "0.1.1"
runtime-context = "0.1.3"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "1"
octet-derive = { version = "0.2.2", path = "octet-derive" }

[features]
serde = ["dep:serde"]